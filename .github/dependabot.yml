# Dependabot version updates
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: deps
      include: scope
    groups:
      python-workspace:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /modules/backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: deps
      include: scope
    groups:
      python-backend:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: deps
      include: scope
    # typescript-eslint does not support TypeScript 7 yet — keep ~5.9 in modules/web.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-web:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /modules/backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: deps
      include: scope
    # Keep runtime aligned with requires-python (<3.15) in pyproject.toml.
    ignore:
      - dependency-name: python
        versions: [">=3.15"]
    groups:
      docker-backend:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /modules/web
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: deps
      include: scope
    groups:
      docker-web:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: deps
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: deps
      include: scope
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
