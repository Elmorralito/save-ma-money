# Dependabot version updates — see:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - CI/CD
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: pip
    directory: /modules/model
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - data model
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: pip
    directory: /modules/api
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - API
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - CI/CD
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: docker
    directory: /docker/database
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - CI/CD
    commit-message:
      prefix: deps
      include: scope
