# Dependabot version updates — see:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - CI/CD
    commit-message:
      prefix: deps
      include: scope
    groups:
      python-workspace:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /modules/model
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - data model
    commit-message:
      prefix: deps
      include: scope
    groups:
      python-model:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /modules/api
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - API
    commit-message:
      prefix: deps
      include: scope
    groups:
      python-api:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - CI/CD
      - frontend
    commit-message:
      prefix: deps
      include: scope
    # typescript-eslint does not support TypeScript 7 yet — keep ~5.9 in modules/web.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-web:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - CI/CD
    commit-message:
      prefix: deps
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /docker/database
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - CI/CD
    commit-message:
      prefix: deps
      include: scope
    groups:
      docker-database:
        patterns:
          - "*"

  # PPT-067 / #132 — API runtime base (python:*-slim) digest bumps
  - package-ecosystem: docker
    directory: /docker/api
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - CI/CD
      - API
    commit-message:
      prefix: deps
      include: scope
    groups:
      docker-api:
        patterns:
          - "*"

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - CI/CD
    commit-message:
      prefix: deps
      include: scope
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
