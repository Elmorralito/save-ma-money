name: Backend CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths-ignore:
      - "docs/**"
      - "modules/web/src/**"
      - "modules/web/e2e/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".nvmrc"
      - ".node-version"
      - ".github/workflows/web-ci.yml"
      - ".github/workflows/web-e2e.yml"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "modules/web/src/**"
      - "modules/web/e2e/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".nvmrc"
      - ".node-version"
      - ".github/workflows/web-ci.yml"
      - ".github/workflows/web-e2e.yml"
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: >-
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'skip-quality')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: papita
          POSTGRES_PASSWORD: papita
          POSTGRES_DB: papita_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction --with development,pre-commit

      - name: Ruff lint & format check
        run: |
          poetry run ruff check backend/src backend/tests
          poetry run ruff format --check backend/src backend/tests

      - name: Mypy type check
        run: poetry run mypy backend/src

      - name: Check committed OpenAPI artifact
        run: ./bin/bash/export_openapi.sh --check

      - name: Run PostgreSQL migration checks
        env:
          DB_URL: postgresql+psycopg2://papita:papita@localhost:5432/papita_test
        run: /bin/bash .github/scripts/migration_check.sh

      - name: Run PyTest with Coverage
        env:
          DATABASE_URL: postgresql+psycopg2://papita:papita@localhost:5432/papita_test
          JWT_SECRET_KEY: test-jwt-secret-key-minimum-32-characters
          AUTH_PROVIDER: local
          AUTH_RATE_LIMIT_ENABLED: "false"
        run: "${GITHUB_WORKSPACE}/bin/bash/test.sh"

      - name: Upload coverage report
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v7
        with:
          files: ./docs/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          flags: unittests
          name: ci-backend
