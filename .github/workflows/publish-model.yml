---
# Publish papita-transactions-model (modules/model) to TestPyPI / PyPI (PPT-024).
# Configure Trusted Publisher on PyPI/TestPyPI for this workflow + environment.
# Secrets: none required when using OIDC (id-token: write). Never commit tokens.
#
# Triggers:
#   - push tag model-v* → PyPI (human/PAT tags; GITHUB_TOKEN tags often do not cascade)
#   - workflow_call from release-model.yml (stable PyPI) or publish-model-dev.yml (TestPyPI)
#   - workflow_dispatch (manual TestPyPI / PyPI escape hatch)

name: Publish model package

on:
  push:
    tags:
      - "model-v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target index"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
      confirm_pypi:
        description: "For target=pypi, type exactly: publish"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      target:
        description: "Publish target index (testpypi | pypi)"
        type: string
        required: true
      ref:
        description: "Git ref/SHA/tag to checkout (empty = caller default ref)"
        type: string
        required: false
        default: ""
      stamp_dev_version:
        description: "Stamp PEP 440 .dev{run_id} before build (TestPyPI PR previews)"
        type: boolean
        required: false
        default: false

concurrency:
  group: publish-model-${{ github.workflow }}-${{ github.ref }}-${{ inputs.target || 'tag' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.pkg_ver.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Stamp unique TestPyPI dev version
        if: ${{ inputs.stamp_dev_version }}
        id: stamp
        run: |
          set -euo pipefail
          NEW_VER="$(python .github/scripts/stamp_model_dev_version.py --run-id "${GITHUB_RUN_ID}")"
          echo "version=${NEW_VER}" >>"${GITHUB_OUTPUT}"
          echo "Stamped papita-transactions-model==${NEW_VER}"

      - name: Build model sdist + wheel
        run: /bin/bash ./bin/package.sh --mod model

      - name: Read package version
        id: pkg_ver
        run: |
          set -euo pipefail
          PKG_VER="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("modules/model/pyproject.toml").read_text())
          print(data["project"]["version"])
          PY
          )"
          echo "version=${PKG_VER}" >>"${GITHUB_OUTPUT}"
          echo "package_version=${PKG_VER}"

      - name: Verify tag version matches pyproject (tag pushes)
        if: startsWith(github.ref, 'refs/tags/model-v')
        run: |
          set -euo pipefail
          TAG_VER="${GITHUB_REF_NAME#model-v}"
          PKG_VER="${{ steps.pkg_ver.outputs.version }}"
          echo "tag=${TAG_VER} pyproject=${PKG_VER}"
          test "${TAG_VER}" = "${PKG_VER}"

      - name: Verify checkout ref tag matches pyproject (workflow_call stable)
        if: >-
          github.event_name == 'workflow_call' &&
          !inputs.stamp_dev_version &&
          inputs.ref != '' &&
          startsWith(inputs.ref, 'model-v')
        run: |
          set -euo pipefail
          TAG_VER="${{ inputs.ref }}"
          TAG_VER="${TAG_VER#model-v}"
          PKG_VER="${{ steps.pkg_ver.outputs.version }}"
          echo "ref_tag=${TAG_VER} pyproject=${PKG_VER}"
          test "${TAG_VER}" = "${PKG_VER}"

      - name: Smoke-install wheel in clean venv
        run: |
          set -euo pipefail
          python -m venv /tmp/model-wheel-smoke
          /tmp/model-wheel-smoke/bin/pip install --upgrade pip
          WHEEL="$(find dist -name 'papita_transactions_model-*.whl' -print | head -1)"
          test -n "${WHEEL}"
          /tmp/model-wheel-smoke/bin/pip install "${WHEEL}"
          /tmp/model-wheel-smoke/bin/python -c "import papita_txnsmodel; from papita_txnsmodel import __version__; print('ok', __version__)"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: model-dist
          path: dist/*
          if-no-files-found: error

  publish-testpypi:
    needs: build
    # Key off inputs.target — inside a reusable workflow github.event_name is the
    # *caller's* event (e.g. pull_request), never "workflow_call".
    if: ${{ inputs.target == 'testpypi' }}
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: model-dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true
          verbose: true

      - name: Summary
        run: |
          {
            echo "## Published to TestPyPI"
            echo ""
            echo "\`papita-transactions-model==${{ needs.build.outputs.package_version }}\`"
          } >>"${GITHUB_STEP_SUMMARY}"

  publish-pypi:
    needs: build
    # Tag pushes have no inputs.target. workflow_call/dispatch set inputs.target=pypi;
    # manual dispatch still requires confirm_pypi=publish. Do not gate on
    # event_name == workflow_call (never true in the called workflow).
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/model-v')) ||
      (inputs.target == 'pypi' && (
        github.event_name != 'workflow_dispatch' ||
        inputs.confirm_pypi == 'publish'
      ))
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: model-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          verbose: true

      - name: Summary
        run: |
          {
            echo "## Published to PyPI"
            echo ""
            echo "\`papita-transactions-model==${{ needs.build.outputs.package_version }}\`"
          } >>"${GITHUB_STEP_SUMMARY}"
