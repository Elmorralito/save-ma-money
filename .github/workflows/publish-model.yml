---
# Publish papita-transactions-model (modules/model) to TestPyPI / PyPI (PPT-024).
# Configure Trusted Publisher on PyPI/TestPyPI for this workflow + environment.
# Secrets: none required when using OIDC (id-token: write). Never commit tokens.

name: Publish model package

on:
  push:
    tags:
      - "model-v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target index"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
      confirm_pypi:
        description: "For target=pypi, type exactly: publish"
        type: string
        required: false
        default: ""

concurrency:
  group: publish-model-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Build model sdist + wheel
        run: /bin/bash ./bin/package.sh --mod model

      - name: Verify tag version matches pyproject (tag pushes)
        if: startsWith(github.ref, 'refs/tags/model-v')
        run: |
          set -euo pipefail
          TAG_VER="${GITHUB_REF_NAME#model-v}"
          PKG_VER="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("modules/model/pyproject.toml").read_text())
          print(data["project"]["version"])
          PY
          )"
          echo "tag=${TAG_VER} pyproject=${PKG_VER}"
          test "${TAG_VER}" = "${PKG_VER}"

      - name: Smoke-install wheel in clean venv
        run: |
          set -euo pipefail
          python -m venv /tmp/model-wheel-smoke
          /tmp/model-wheel-smoke/bin/pip install --upgrade pip
          WHEEL="$(find dist -name 'papita_transactions_model-*.whl' -print | head -1)"
          test -n "${WHEEL}"
          /tmp/model-wheel-smoke/bin/pip install "${WHEEL}"
          /tmp/model-wheel-smoke/bin/python -c "import papita_txnsmodel; from papita_txnsmodel import __version__; print('ok', __version__)"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-dist
          path: dist/*
          if-no-files-found: error

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true
          verbose: true

  publish-pypi:
    needs: build
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/model-v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi' && inputs.confirm_pypi == 'publish')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
