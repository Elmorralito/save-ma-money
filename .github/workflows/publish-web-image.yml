# Publish @papita/web nginx SPA image to GHCR (PPT-067 / #132 extension).
# Dockerfile SSOT: docker/web/Dockerfile (PPT-057 / PPT-063).
# Naming SSOT: docker/README.md
#
# Only custom runtime Dockerfiles in this monorepo are api + web (Postgres/Redis
# are upstream; Compose migrate reuses the API image). Web is the other
# high-cost build (pnpm install + Vite → nginx).
#
# Policy: same as publish-api-image.yml (main stable / PR dev / Trivy gate).
# PR publish-dev only when the PR touches web runtime paths (not e2e-only or
# workflow-only bumps); skippable with skip-web-image-dev.

name: Publish Web image

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths:
      - "docker/web/**"
      - "modules/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".dockerignore"
      - ".github/workflows/publish-web-image.yml"
      - ".github/scripts/web_image_smoke.sh"
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke-only (no push) | publish (main → stable GHCR tags)"
        type: choice
        options:
          - smoke-only
          - publish
        default: smoke-only

concurrency:
  group: >-
    publish-web-image-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: save-ma-money-web

jobs:
  # Detect web runtime path changes (main + PR).
  # PR publish-dev: docker/web + SPA sources/lockfiles (not e2e/docs/workflow-only).
  # Main stable: also treat workflow/smoke script edits as publish-relevant.
  changes:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      web: ${{ steps.check.outputs.web }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect web image paths
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            range="${BASE_SHA}...${HEAD_SHA}"
          else
            if [[ -z "${BEFORE}" || "${BEFORE}" =~ ^0+$ ]]; then
              echo "web=true" >>"${GITHUB_OUTPUT}"
              echo "No usable before SHA — treating as web-relevant"
              exit 0
            fi
            range="${BEFORE}...${SHA}"
          fi
          web=false
          count=0
          while IFS= read -r f; do
            [[ -z "${f}" ]] && continue
            count=$((count + 1))
            case "${f}" in
              # Playwright / docs do not change the nginx runtime image.
              modules/web/e2e/* | modules/web/docs/* | modules/web/README.md) ;;
              docker/web/* | \
              modules/web/* | \
              package.json | \
              pnpm-lock.yaml | \
              pnpm-workspace.yaml | \
              .nvmrc | \
              .dockerignore)
                web=true
                ;;
            esac
            if [[ "${EVENT_NAME}" == "push" ]]; then
              case "${f}" in
                .github/workflows/publish-web-image.yml | \
                .github/scripts/web_image_smoke.sh)
                  web=true
                  ;;
              esac
            fi
          done < <(git diff --name-only "${range}" || true)
          echo "web=${web}" >>"${GITHUB_OUTPUT}"
          echo "web=${web} event=${EVENT_NAME} range=${range} changed_files=${count}"

  build-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'smoke-only'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read web package version
        id: pkg_ver
        run: |
          set -euo pipefail
          PKG_VER="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("modules/web/package.json").read_text())["version"])
          PY
          )"
          echo "version=${PKG_VER}" >>"${GITHUB_OUTPUT}"

      - name: Image coordinates
        id: meta
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          OWNER="$(echo "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/${IMAGE_NAME}"
          echo "image=${IMAGE}" >>"${GITHUB_OUTPUT}"
          echo "tags=${IMAGE}:ci" >>"${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build web image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          sbom: false
          build-args: |
            VITE_APP_TITLE=Papita
            VITE_PAPITA_BREAKING_CHANGES_ID=ppt-044
            VITE_API_BASE_URL=
          cache-from: type=gha,scope=papita-web-nginx
          cache-to: type=gha,mode=max,scope=papita-web-nginx
          labels: |
            org.opencontainers.image.title=save-ma-money-web
            org.opencontainers.image.description=Papita web SPA (nginx)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.pkg_ver.outputs.version }}

      - name: Smoke GET / + SPA security headers
        run: /bin/bash .github/scripts/web_image_smoke.sh "${{ steps.meta.outputs.tags }}"

      - name: Summary
        env:
          PKG_VER: ${{ steps.pkg_ver.outputs.version }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          {
            echo "## Web image build-smoke (PPT-067)"
            echo ""
            echo "- Package version: \`${PKG_VER}\`"
            echo "- Image (local): \`${IMAGE}:ci\`"
            echo "- Push: \`false\`"
            echo "- SSOT: \`docker/README.md\`"
          } >>"${GITHUB_STEP_SUMMARY}"

  publish:
    needs: [changes]
    if: >-
      always() &&
      needs.changes.result != 'failure' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.web == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish')
      )
    runs-on: ubuntu-latest
    environment: ghcr
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Guard main-only publish
        env:
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "${REF}" != "refs/heads/main" ]]; then
            echo "Stable web images publish only from main (got ${REF} event=${EVENT_NAME})" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read web package version
        id: pkg_ver
        run: |
          set -euo pipefail
          PKG_VER="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("modules/web/package.json").read_text())["version"])
          PY
          )"
          echo "version=${PKG_VER}" >>"${GITHUB_OUTPUT}"

      - name: Decide platforms / tags (stable)
        id: meta
        env:
          SHA: ${{ github.sha }}
          PKG_VER: ${{ steps.pkg_ver.outputs.version }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          OWNER="$(echo "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/${IMAGE_NAME}"
          SHORT_SHA="$(echo "${SHA}" | cut -c1-12)"
          PLATFORMS="linux/amd64,linux/arm64"
          TAGS=(
            "${IMAGE}:edge"
            "${IMAGE}:${PKG_VER}"
            "${IMAGE}:js-web-v${PKG_VER}"
            "${IMAGE}:sha-${SHORT_SHA}"
          )
          TAGS_CSV="$(IFS=,; echo "${TAGS[*]}")"
          {
            echo "image=${IMAGE}"
            echo "kind=stable"
            echo "platforms=${PLATFORMS}"
            echo "short_sha=${SHORT_SHA}"
            echo "tags=${TAGS_CSV}"
            echo "tags_list<<EOF"
            printf '%s\n' "${TAGS[@]}"
            echo "EOF"
          } >>"${GITHUB_OUTPUT}"
          printf 'tags:\n'
          printf '  %s\n' "${TAGS[@]}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build amd64 for Trivy gate + smoke
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: papita-web:scan
          provenance: false
          sbom: false
          build-args: |
            VITE_APP_TITLE=Papita
            VITE_PAPITA_BREAKING_CHANGES_ID=ppt-044
            VITE_API_BASE_URL=
          cache-from: type=gha,scope=papita-web-nginx
          cache-to: type=gha,mode=max,scope=papita-web-nginx
          labels: |
            org.opencontainers.image.title=save-ma-money-web
            org.opencontainers.image.description=Papita web SPA (nginx)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.pkg_ver.outputs.version }}
            com.github.papita.image.channel=stable

      - name: Trivy image vulnerability gate
        uses: ./.github/actions/trivy-api-image-gate
        with:
          image-ref: papita-web:scan
          sarif-category: trivy-web-image-stable
          sarif-file: trivy-web-image-stable.sarif

      - name: Smoke GET / + SPA security headers (pre-push)
        run: /bin/bash .github/scripts/web_image_smoke.sh papita-web:scan

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-arch stable)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          platforms: ${{ steps.meta.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          sbom: false
          build-args: |
            VITE_APP_TITLE=Papita
            VITE_PAPITA_BREAKING_CHANGES_ID=ppt-044
            VITE_API_BASE_URL=
          cache-from: type=gha,scope=papita-web-nginx
          cache-to: type=gha,mode=max,scope=papita-web-nginx
          labels: |
            org.opencontainers.image.title=save-ma-money-web
            org.opencontainers.image.description=Papita web SPA (nginx)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.pkg_ver.outputs.version }}
            org.opencontainers.image.licenses=MIT
            com.github.papita.module=web
            com.github.papita.package=@papita/web
            com.github.papita.image.channel=stable

      - name: Resolve image digests (pin guidance)
        id: digests
        env:
          TAGS_LIST: ${{ steps.meta.outputs.tags_list }}
        run: |
          set -euo pipefail
          {
            echo "digests_md<<EOF"
            while IFS= read -r tag; do
              [[ -z "${tag}" ]] && continue
              DIGEST="$(docker buildx imagetools inspect "${tag}" 2>/dev/null | awk '/^Digest:/ {print $2; exit}' || true)"
              if [[ -n "${DIGEST}" ]]; then
                echo "- \`${tag}@${DIGEST}\`"
              else
                echo "- \`${tag}\` (digest lookup unavailable)"
              fi
            done <<< "${TAGS_LIST}"
            echo "EOF"
          } >>"${GITHUB_OUTPUT}"

      - name: Summary
        env:
          PKG_VER: ${{ steps.pkg_ver.outputs.version }}
          IMAGE: ${{ steps.meta.outputs.image }}
          PLATFORMS: ${{ steps.meta.outputs.platforms }}
          TAGS_LIST: ${{ steps.meta.outputs.tags_list }}
          DIGESTS_MD: ${{ steps.digests.outputs.digests_md }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          {
            echo "## Web image publish — stable (main)"
            echo ""
            echo "- Package version: \`${PKG_VER}\`"
            echo "- Image: \`${IMAGE}\`"
            echo "- Platforms: \`${PLATFORMS}\`"
            echo "- Gates: Trivy CRITICAL/HIGH (pre-push) · SPA header smoke"
            echo "- Tags:"
            while IFS= read -r tag; do
              [[ -z "${tag}" ]] && continue
              echo "  - \`${tag}\`"
            done <<< "${TAGS_LIST}"
            echo ""
            echo "### Prefer digest pins for staging/prod"
            echo ""
            echo "${DIGESTS_MD}"
            echo ""
            echo "Immutable alternative: \`${IMAGE}:sha-${SHORT_SHA}\`"
            echo ""
            echo "SSOT: \`docker/README.md\` · environment: \`ghcr\`"
          } >>"${GITHUB_STEP_SUMMARY}"

  publish-dev:
    needs: [changes]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.web == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'skip-web-image-dev')
    runs-on: ubuntu-latest
    environment: ghcr-dev
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Read web package version
        id: pkg_ver
        run: |
          set -euo pipefail
          PKG_VER="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("modules/web/package.json").read_text())["version"])
          PY
          )"
          echo "version=${PKG_VER}" >>"${GITHUB_OUTPUT}"

      - name: Decide platforms / tags (dev only)
        id: meta
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          PKG_VER: ${{ steps.pkg_ver.outputs.version }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number: ${PR_NUMBER}" >&2
            exit 1
          fi
          OWNER="$(echo "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/${IMAGE_NAME}"
          SHORT_SHA="$(echo "${SHA}" | cut -c1-12)"
          TAGS=(
            "${IMAGE}:pr-${PR_NUMBER}"
            "${IMAGE}:pr-${PR_NUMBER}-${SHORT_SHA}"
            "${IMAGE}:dev-${RUN_ID}"
          )
          for tag in "${TAGS[@]}"; do
            case "${tag}" in
              *:edge | *:js-web-v* )
                echo "Refusing forbidden release tag: ${tag}" >&2
                exit 1
                ;;
            esac
            suffix="${tag##*:}"
            if [[ "${suffix}" =~ ^[0-9] ]]; then
              echo "Refusing semver-like tag: ${tag}" >&2
              exit 1
            fi
          done
          TAGS_CSV="$(IFS=,; echo "${TAGS[*]}")"
          {
            echo "image=${IMAGE}"
            echo "kind=dev"
            echo "platforms=linux/amd64"
            echo "short_sha=${SHORT_SHA}"
            echo "pr=${PR_NUMBER}"
            echo "dev_version=${PKG_VER}.dev${RUN_ID}+pr${PR_NUMBER}"
            echo "tags=${TAGS_CSV}"
            echo "tags_list<<EOF"
            printf '%s\n' "${TAGS[@]}"
            echo "EOF"
          } >>"${GITHUB_OUTPUT}"
          printf 'dev tags:\n'
          printf '  %s\n' "${TAGS[@]}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build amd64 for Trivy gate + smoke
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: papita-web:scan
          provenance: false
          sbom: false
          build-args: |
            VITE_APP_TITLE=Papita
            VITE_PAPITA_BREAKING_CHANGES_ID=ppt-044
            VITE_API_BASE_URL=
          cache-from: type=gha,scope=papita-web-nginx-dev
          cache-to: type=gha,mode=max,scope=papita-web-nginx-dev
          labels: |
            org.opencontainers.image.title=save-ma-money-web
            org.opencontainers.image.description=Papita web SPA (nginx) PR preview
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.dev_version }}
            com.github.papita.image.channel=dev

      - name: Trivy image vulnerability gate
        uses: ./.github/actions/trivy-api-image-gate
        with:
          image-ref: papita-web:scan
          sarif-category: trivy-web-image-dev
          sarif-file: trivy-web-image-dev.sarif

      - name: Smoke GET / + SPA security headers (pre-push)
        run: /bin/bash .github/scripts/web_image_smoke.sh papita-web:scan

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push amd64 dev tags
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          sbom: false
          build-args: |
            VITE_APP_TITLE=Papita
            VITE_PAPITA_BREAKING_CHANGES_ID=ppt-044
            VITE_API_BASE_URL=
          cache-from: type=gha,scope=papita-web-nginx-dev
          cache-to: type=gha,mode=max,scope=papita-web-nginx-dev
          labels: |
            org.opencontainers.image.title=save-ma-money-web
            org.opencontainers.image.description=Papita web SPA (nginx) PR preview
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.dev_version }}
            org.opencontainers.image.licenses=MIT
            com.github.papita.module=web
            com.github.papita.package=@papita/web
            com.github.papita.image.channel=dev
            com.github.papita.pr.number=${{ github.event.pull_request.number }}

      - name: Summary
        env:
          PKG_VER: ${{ steps.pkg_ver.outputs.version }}
          DEV_VER: ${{ steps.meta.outputs.dev_version }}
          IMAGE: ${{ steps.meta.outputs.image }}
          TAGS_LIST: ${{ steps.meta.outputs.tags_list }}
          PR: ${{ steps.meta.outputs.pr }}
        run: |
          {
            echo "## Web image publish — PR dev"
            echo ""
            echo "- PR: \`#${PR}\`"
            echo "- Package version: \`${PKG_VER}\`"
            echo "- Dev label: \`${DEV_VER}\`"
            echo "- Image: \`${IMAGE}\`"
            echo "- Gates: Trivy CRITICAL/HIGH (pre-push) · SPA header smoke"
            echo "- Tags (dev channel only):"
            while IFS= read -r tag; do
              [[ -z "${tag}" ]] && continue
              echo "  - \`${tag}\`"
            done <<< "${TAGS_LIST}"
            echo ""
            echo "Opt out: label \`skip-web-image-dev\`"
            echo ""
            echo "SSOT: \`docker/README.md\` · environment: \`ghcr-dev\`"
          } >>"${GITHUB_STEP_SUMMARY}"
