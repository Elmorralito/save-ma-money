---
name: Migration Check

on:
  pull_request:
    paths:
      - "modules/model/alembic/**"
      - "modules/model/src/papita_txnsmodel/model/**"
      - "modules/model/tests/**/integration/**"
      - "modules/api/tests/**"
      - "docker/database/**"
      - "deploy/alembic.sh"
      - ".github/scripts/migration_check.sh"
      - ".github/workflows/migration-check.yml"
  push:
    branches:
      - main
    paths:
      - "modules/model/alembic/**"
      - "modules/model/src/papita_txnsmodel/model/**"
      - "modules/model/tests/**/integration/**"
      - "modules/api/tests/**"
      - "docker/database/**"
      - "deploy/alembic.sh"
      - ".github/scripts/migration_check.sh"
      - ".github/workflows/migration-check.yml"

jobs:
  postgres-migrations:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: papita
          POSTGRES_PASSWORD: papita
          POSTGRES_DB: papita_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run PostgreSQL migration checks
        env:
          DB_URL: postgresql+psycopg2://papita:papita@localhost:5432/papita_test
        run: /bin/bash .github/scripts/migration_check.sh
