---
name: Frontend Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "modules/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".node-version"
      - ".dockerignore"
      - ".github/workflows/frontend-quality.yml"
  push:
    branches:
      - main
    paths:
      - "modules/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".node-version"
      - ".dockerignore"
      - ".github/workflows/frontend-quality.yml"
  workflow_dispatch:

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    if: >-
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'skip-quality')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Enable pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check OpenAPI TypeScript types
        run: pnpm web:check-types

      - name: Lint
        run: pnpm web:lint

      - name: Test with coverage
        run: pnpm web:test:coverage

      - name: Production dependency audit
        run: pnpm web:audit
        continue-on-error: true

      - name: Build
        run: pnpm web:build

  frontend-docker:
    if: >-
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'skip-quality')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build web nginx image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: modules/web/Dockerfile
          load: true
          push: false
          build-args: |
            VITE_APP_TITLE=Papita
            VITE_PAPITA_BREAKING_CHANGES_ID=ppt-044
            VITE_API_BASE_URL=
          cache-from: type=gha,scope=save-ma-money-web
          cache-to: type=gha,mode=max,scope=save-ma-money-web
          tags: papita-web:ci

      - name: Smoke SPA security headers
        run: /bin/bash deploy/scripts/web_image_smoke.sh papita-web:ci
