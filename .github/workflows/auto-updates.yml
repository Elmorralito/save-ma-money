---
name: Auto Updates

on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  auto-update:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    env:
      CODECOV_REPORT_URL: https://app.codecov.io/github/${{ github.repository }}
    permissions:
      contents: write
      issues: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install Poetry"
        uses: "snok/install-poetry@v1"
        with:
          version: 2.1.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: "Install dependencies"
        run: |
          poetry install --no-interaction --with development,pre-commit
          python -m pip install pylint pytest pytest-cov coverage jinja2 requests

      - name: Update CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: poetry run python .github/scripts/update_todos.py

      - name: Update badges
        run: |
          poetry run genbadge coverage -i "${GITHUB_WORKSPACE}/docs/coverage.xml" -o "${GITHUB_WORKSPACE}/docs/coverage-badge.svg"
          poetry run flake8 "${GITHUB_WORKSPACE}/modules/" --exit-zero --format=html --htmldir "${GITHUB_WORKSPACE}/docs/.flake8" --statistics --tee --output-file "${GITHUB_WORKSPACE}/docs/.flake8/report.txt" && \
            poetry run genbadge flake8 -i "${GITHUB_WORKSPACE}/docs/.flake8/report.txt" -o "${GITHUB_WORKSPACE}/docs/flake8-badge.svg"

      - name: Update coverage badge link in README
        run: |
          python <<'PY'
          import os
          import pathlib
          import re
          import sys

          report_url = os.environ["CODECOV_REPORT_URL"]
          readme_path = pathlib.Path("README.md")
          text = readme_path.read_text(encoding="utf-8")
          pattern = r"(\[\!\[coverage score\]\(\./docs/coverage-badge\.svg\)\])\([^)]+\)"
          updated, count = re.subn(pattern, rf"\1({report_url})", text, count=1)
          if count != 1:
              sys.exit(f"Expected to update 1 coverage badge link in README.md, updated {count}")
          readme_path.write_text(updated, encoding="utf-8")
          print(f"README coverage badge now links to {report_url}")
          PY

      - name: Format generated markdown before commit
        run: |
          poetry run pre-commit run --files CHANGELOG.md README.md || true
          poetry run pre-commit run --files CHANGELOG.md README.md

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add CHANGELOG.md README.md docs/coverage-badge.svg docs/flake8-badge.svg
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update CHANGELOG.md [skip ci]"
            git pull --rebase && git push -o ci.skip
          fi
