---
# Python-only CodeQL. JavaScript/TypeScript is a separate workflow: codeql-javascript.yml
name: CodeQL Analysis

on:
  pull_request:
    branches:
      - main
    paths:
      - "modules/model/**"
      - "modules/api/**"
      - "modules/model/pyproject.toml"
      - "modules/api/pyproject.toml"
      - "pyproject.toml"
      - ".github/workflows/codeql.yml"
  push:
    branches:
      - main
    paths:
      - "modules/model/**"
      - "modules/api/**"
      - "modules/model/pyproject.toml"
      - "modules/api/pyproject.toml"
      - "pyproject.toml"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v3
        with:
          languages: python
          queries: security-extended

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v3
        with:
          category: /language:python
