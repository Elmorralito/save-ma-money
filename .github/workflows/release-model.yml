---
# python-semantic-release for modules/model only (PPT-024 + PPT-066).
# Writes modules/model/CHANGELOG.md + bumps pyproject version + tags py-model-v*.
# Does NOT touch repo-root CHANGELOG.md (owned by auto-updates.yml).
# On a successful release, calls publish-model.yml (workflow_call) so PyPI publish
# still runs when GITHUB_TOKEN tag pushes do not cascade to other workflows.

name: Release model (semantic-release)

on:
  push:
    branches:
      - main
    paths:
      - "modules/model/**"
      - ".github/workflows/release-model.yml"
      - ".github/workflows/publish-model.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Force version bump (leave as none for auto)"
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: none

concurrency:
  group: release-model-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.meta.outputs.released }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout release branch at workflow SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Force branch tip to workflow SHA
        run: git reset --hard "${{ github.sha }}"

      - name: Semantic version (auto)
        id: release
        if: github.event_name == 'push' || inputs.force == 'none'
        uses: python-semantic-release/python-semantic-release@v10.6.1
        with:
          directory: modules/model
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build: "false"
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"

      - name: Semantic version (forced bump)
        id: release_forced
        if: github.event_name == 'workflow_dispatch' && inputs.force != 'none'
        uses: python-semantic-release/python-semantic-release@v10.6.1
        with:
          directory: modules/model
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build: "false"
          force: ${{ inputs.force }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"

      - name: Export release metadata
        id: meta
        env:
          RELEASED: ${{ steps.release.outputs.released || steps.release_forced.outputs.released || 'false' }}
          VERSION: ${{ steps.release.outputs.version || steps.release_forced.outputs.version || '' }}
          TAG: ${{ steps.release.outputs.tag || steps.release_forced.outputs.tag || '' }}
        run: |
          set -euo pipefail
          {
            echo "released=${RELEASED}"
            echo "version=${VERSION}"
            echo "tag=${TAG}"
          } >>"${GITHUB_OUTPUT}"
          echo "released=${RELEASED} version=${VERSION} tag=${TAG}"

  publish:
    name: Publish to PyPI
    needs: release
    if: needs.release.outputs.released == 'true' && needs.release.outputs.tag != ''
    uses: ./.github/workflows/publish-model.yml
    with:
      target: pypi
      ref: ${{ needs.release.outputs.tag }}
      stamp_dev_version: false
    permissions:
      id-token: write
      contents: read
