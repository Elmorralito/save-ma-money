---
# python-semantic-release for modules/model only (PPT-024).
# Writes modules/model/CHANGELOG.md + bumps pyproject version + tags model-v*.
# Does NOT touch repo-root CHANGELOG.md (owned by auto-updates.yml).
# PyPI upload stays in publish-model.yml (triggered by model-v* tags).

name: Release model (semantic-release)

on:
  push:
    branches:
      - main
    paths:
      - "modules/model/**"
      - ".github/workflows/release-model.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Force version bump (leave as none for auto)"
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: none

concurrency:
  group: release-model-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release branch at workflow SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Force branch tip to workflow SHA
        run: git reset --hard "${{ github.sha }}"

      - name: Semantic version (auto)
        id: release
        if: github.event_name == 'push' || inputs.force == 'none'
        uses: python-semantic-release/python-semantic-release@v10.6.1
        with:
          directory: modules/model
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build: "false"
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"

      - name: Semantic version (forced bump)
        id: release_forced
        if: github.event_name == 'workflow_dispatch' && inputs.force != 'none'
        uses: python-semantic-release/python-semantic-release@v10.6.1
        with:
          directory: modules/model
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build: "false"
          force: ${{ inputs.force }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"

      - name: Summary
        env:
          RELEASED: ${{ steps.release.outputs.released || steps.release_forced.outputs.released || 'false' }}
          VERSION: ${{ steps.release.outputs.version || steps.release_forced.outputs.version || '' }}
          TAG: ${{ steps.release.outputs.tag || steps.release_forced.outputs.tag || '' }}
        run: |
          echo "released=${RELEASED}"
          echo "version=${VERSION}"
          echo "tag=${TAG}"
