---
name: Strata Check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "modules/**"
      - "pyproject.toml"
      - "bin/**"
      - ".github/scripts/**"
      - ".github/workflows/strata-check.yml"
  push:
    branches:
      - main
    paths:
      - "modules/**"
      - "pyproject.toml"
      - "bin/**"
      - ".github/scripts/**"
      - ".github/workflows/strata-check.yml"
  workflow_dispatch:

concurrency:
  group: strata-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strata-check:
    if: >-
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'skip-strata')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies for Strata code review
        run: poetry install --no-interaction --with development,pre-commit

      - name: Run Strata layout validation and lint code review
        env:
          TERM: xterm-256color
          STRATA_STRICT_MODULES: "1"
          STRATA_CODE_REVIEW: "1"
          STRATA_BASE_REF: ${{ github.event_name == 'push' && 'HEAD~1' || format('origin/{0}', github.base_ref) }}
        run: /bin/bash .github/scripts/strata_check.sh
