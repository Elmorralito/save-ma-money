---
name: Strata Check

on:
  pull_request:
    paths:
      - "modules/**"
      - "pyproject.toml"
      - "deploy/**"
      - ".github/scripts/**"
      - ".github/workflows/strata-check.yml"
  workflow_dispatch:

concurrency:
  group: strata-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strata-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies for Strata code review
        run: poetry install --no-interaction --with development,pre-commit

      - name: Run Strata layout validation and code review
        env:
          TERM: xterm-256color
          STRATA_STRICT_MODULES: "1"
          STRATA_CODE_REVIEW: "1"
          STRATA_BASE_REF: origin/${{ github.base_ref }}
        run: /bin/bash .github/scripts/strata_check.sh
