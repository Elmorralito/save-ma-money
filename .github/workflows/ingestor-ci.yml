name: Ingestor CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "modules/ingestor-core/**"
      - "modules/ingestors/**"
      - "bin/make/ingestor.mk"
      - "pyproject.toml"
      - ".github/workflows/ingestor-ci.yml"
  push:
    branches:
      - main
    paths:
      - "modules/ingestor-core/**"
      - "modules/ingestors/**"
      - "bin/make/ingestor.mk"
      - "pyproject.toml"
      - ".github/workflows/ingestor-ci.yml"

  workflow_dispatch:

concurrency:
  group: ingestor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingestor:
    if: >-
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'skip-ingestor-ci')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction --with development,pre-commit

      - name: Lint ingestor packages
        run: make ingestor-lint

      - name: Test ingestor packages
        run: make ingestor-test
