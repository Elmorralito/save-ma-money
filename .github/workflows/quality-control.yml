---
name: Code Quality Control

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths-ignore:
      - "docs/**"
      - "modules/web/**"
      - "modules/ingestor-core/**"
      - "modules/ingestors/**"
      - "docker/ingestor/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".nvmrc"
      - ".node-version"
      - ".github/workflows/web-ci.yml"
      - ".github/workflows/ingestor-ci.yml"
      - "bin/make/ingestor.mk"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "modules/web/**"
      - "modules/ingestor-core/**"
      - "modules/ingestors/**"
      - "docker/ingestor/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".nvmrc"
      - ".node-version"
      - ".github/workflows/web-ci.yml"
      - ".github/workflows/ingestor-ci.yml"
      - "bin/make/ingestor.mk"

  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: quality-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-control:
    if: >-
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'skip-quality')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: papita
          POSTGRES_PASSWORD: papita
          POSTGRES_DB: papita_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "Checkout code"
        uses: "actions/checkout@v7"

      - name: "Set up Python"
        uses: "actions/setup-python@v7"
        with:
          python-version: "3.12" # Specify the exact Python version here
          cache: "pip"

      - name: "Install Poetry"
        uses: "snok/install-poetry@v1"
        with:
          version: 2.1.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: "Install dependencies"
        run: |
          poetry install --no-interaction --with development,pre-commit
          python -m pip install pytest pytest-cov coverage

      - name: "Run lint and format checks (pre-commit)"
        uses: "pre-commit/action@v3.0.1"
        env:
          # Local-only hooks; Strata/MCP use dedicated workflows; web quality → web-ci.yml.
          SKIP: strata-validate,mcp-config-validate,web-eslint,web-prettier,web-tsc,web-vitest-related

      - name: "Run database migrations (live integration tests)"
        env:
          DB_URL: postgresql+psycopg2://papita:papita@localhost:5432/papita_test
        run: |
          poetry run alembic -c modules/model/alembic.ini -x "dbUrl=${DB_URL}" upgrade head

      - name: "Run PyTest with Coverage"
        env:
          DATABASE_URL: postgresql+psycopg2://papita:papita@localhost:5432/papita_test
          JWT_SECRET_KEY: test-jwt-secret-key-minimum-32-characters
          AUTH_PROVIDER: local
          AUTH_RATE_LIMIT_ENABLED: "false"
        run: |
          "${GITHUB_WORKSPACE}/bin/bash/test.sh"

      - name: "Detect Codecov token"
        id: codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "${CODECOV_TOKEN}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: "Upload coverage report"
        if: steps.codecov.outputs.enabled == 'true'
        uses: "codecov/codecov-action@v7"
        with:
          files: "./docs/coverage.xml"
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          flags: unittests
          name: ci-quality-control
          verbose: true
