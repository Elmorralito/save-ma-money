---
name: Supabase B1 Smoke

# Optional PPT-040 dual-target gate: runs pooler smoke when SUPABASE_B1_DATABASE_URL
# is configured. Skips cleanly (job success) when the secret is absent so forks/PRs
# stay green. Supabase Auth JWT smoke remains manual: `make auth-smoke`.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: supabase-b1-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  b1-smoke:
    name: Supabase pooler B1 smoke
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: "actions/checkout@v7"

      - name: "Detect B1 pooler secret"
        id: b1
        env:
          SUPABASE_B1_DATABASE_URL: ${{ secrets.SUPABASE_B1_DATABASE_URL }}
        run: |
          if [ -n "${SUPABASE_B1_DATABASE_URL}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "SUPABASE_B1_DATABASE_URL is unset — skipping B1 smoke (optional PPT-040 gate)."
          fi

      - name: "Set up Python"
        if: steps.b1.outputs.enabled == 'true'
        uses: "actions/setup-python@v6"
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install Poetry"
        if: steps.b1.outputs.enabled == 'true'
        uses: "snok/install-poetry@v1"
        with:
          version: 2.1.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: "Install dependencies"
        if: steps.b1.outputs.enabled == 'true'
        run: poetry install --no-interaction

      - name: "Detect B1 migrations secret"
        id: b1_migrate
        if: steps.b1.outputs.enabled == 'true'
        env:
          SUPABASE_B1_DATABASE_URL_MIGRATIONS: ${{ secrets.SUPABASE_B1_DATABASE_URL_MIGRATIONS }}
        run: |
          if [ -n "${SUPABASE_B1_DATABASE_URL_MIGRATIONS}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "SUPABASE_B1_DATABASE_URL_MIGRATIONS unset — assuming schema already exists on pooler DB."
          fi

      - name: "Run Alembic migrations (B1 direct URL)"
        if: steps.b1.outputs.enabled == 'true' && steps.b1_migrate.outputs.enabled == 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_B1_DATABASE_URL_MIGRATIONS }}
        run: |
          poetry run alembic -c modules/model/alembic.ini -x "dbUrl=${DB_URL}" upgrade head

      - name: "Run B1 pooler smoke pytest"
        if: steps.b1.outputs.enabled == 'true'
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_B1_DATABASE_URL }}
          JWT_SECRET_KEY_SECRET: ${{ secrets.JWT_SECRET_KEY }}
          AUTH_PROVIDER: local
          AUTH_RATE_LIMIT_ENABLED: "false"
        run: |
          export JWT_SECRET_KEY="${JWT_SECRET_KEY_SECRET:-test-jwt-secret-key-minimum-32-characters}"
          poetry run pytest modules/api/tests/test_supabase_b1_smoke.py -q
