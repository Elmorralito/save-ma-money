[tool.poetry]
name = "save-ma-money"
version = "v0.0.1"
description = "Papita Public projects: save-me-money"
readme = "README.md"
package-mode = false
authors = ["Elmorralito <drestrepohinc@gmail.com>"]
include = ["README.md"]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
cryptography = ">=50.0.0,<51.0.0"
supabase = ">=2.13.0,<3.0.0"

[tool.poetry.group.development.dependencies]
papita-transactions-api = { path = "modules/api", develop = true }
papita-transactions-model = { path = "modules/model", develop = true }
papita-ingestor-core = { path = "modules/ingestor-core", develop = true }
papita-ingestor-email = { path = "modules/ingestors/email", develop = true }

[tool.poetry.group.ci.dependencies]
requests = "^2.32.5"
jinja2 = "^3.1.6"
genbadge = { version = "^1.1.2", extras = ["coverage", "flake8"] }

[tool.poetry.group.pre-commit.dependencies]
black = "^26.3.1"
mypy = "^1.14.1"
pre-commit = "^3.7.1"
pylint = "^3.2.6"
flake8 = "^7.1.0"
isort = "^5.13.2"
pytest = "^9.0.2"
pytest-cov = "^5.0.0"
boto3-stubs = "^1.34.147"
build = "^1.2.2.post1"
types-pyyaml = "^6.0.12.20241230"
ipykernel = "^6.29.5"
types-python-dateutil = "^2.9.0.20250516"
sqlfluff = "^4.2.0"
tabulate = "^0.10.0"
types-tabulate = "^0.10.0.20260508"
types-toml = "^0.10.8.20240310"
types-requests = "^2.32.4.20250913"
types-pytz = "^2025.2.0.20250809"
flake8-pyproject = "^1.2.4"
fakeredis = { version = "^2.26.0", extras = ["lua"] }

[build-system]
requires = ["poetry>=1.1.13"]
build-backend = "poetry.masonry.api"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -raqvs --cov=./modules/model/src --cov=./modules/api/src --cov-report xml:docs/coverage.xml"
testpaths = [
    "./modules/api/tests",
    "./modules/model/tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore:The `__fields__` attribute is deprecated:pydantic.PydanticDeprecatedSince20",
]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if self\\.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

ignore_errors = true

[tool.coverage.run]
branch = true

[tool.pylint]
init-hook = 'import sys; sys.path.extend(["./modules/api/src", "./modules/model/src", "./modules/ingestor-core/src", "./modules/ingestors/email/src"])'
ignored-modules = ["psycopg2.errors"]
max-args = 8

[tool.pylint.MASTER]
ignore-paths = ["^.*/tests/.*$"]

[tool.pylint.'MESSAGES CONTROL']
disable = [
    "broad-except",
    "redefined-outer-name",
    "import-outside-toplevel",
    "too-few-public-methods",
    "raw-checker-failed",
    "bad-inline-option",
    "locally-disabled",
    "file-ignored",
    "suppressed-message",
    "useless-suppression",
    "deprecated-pragma",
    "use-symbolic-message-instead",
    "wildcard-import",
    "unused-wildcard-import",
    "missing-module-docstring",
    "missing-function-docstring",
    "missing-class-docstring",
    "duplicate-code",
    "unused-argument",
    "attribute-defined-outside-init",
    "use-a-generator",
    "unnecessary-comprehension",
    "consider-using-dict-comprehension",
    "E1101",
    "W0511",
]

[tool.pylint.'FORMAT']
max-line-length = 120
max-module-lines = 1000

[tool.black]
line-length = 120
target-version = ["py312"]
include = "\\.pyi?$"

[tool.mypy]
mypy_path = ["*"]
exclude = ["tests/*"]
python_version = "3.12"
disable_error_code = ["union-attr", "misc", "attr-defined"]
warn_unused_ignores = true
disallow_any_decorated = false
disallow_untyped_defs = false
ignore_missing_imports = true
disallow_untyped_calls = false
namespace_packages = true

[tool.isort]
skip = [".gitignore", ".dockerignore"]
extend_skip = [".md", ".json", ".yaml", ".yml", ".sh"]
known_first_party = [
    "papita_txnsapi",
    "papita_txnsmodel",
    "papita_ingestor_core",
    "papita_ingestor_email",
]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
py_version = 312
atomic = true
profile = "black"
line_length = 120
skip_gitignore = true

[tool.flake8]
ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "dist",
    "*.ipynb",
    "./modules/api/tests/*",
    "./modules/model/tests/*",
    "./modules/ingestor-core/tests/*",
    "./modules/ingestors/email/tests/*",
]
max-line-length = 120
max-complexity = 18

# SQLFluff — PostgreSQL query standard for materialized-view SQL under
# modules/model/src/papita_txnsmodel/views/ (enforced via pre-commit sqlfluff hooks).
[tool.sqlfluff.core]
dialect = "postgres"
templater = "raw"
max_line_length = 120
sql_file_exts = ".sql"
large_file_skip_byte_limit = 0
exclude_paths = [
    ".venv/**",
    "venv/**",
    "**/node_modules/**",
    "**/__pycache__/**",
]
# ST06/ST09: column/join ordering is too rigid for aggregate MV definitions.
exclude_rules = ["ST06", "ST09"]

[tool.sqlfluff.indentation]
indent_unit = "space"
tab_space_size = 4
indented_joins = true
indented_ctes = false
indented_using_on = true
indented_on_contents = true
indented_then = true
indented_then_contents = true
implicit_indents = "forbid"

[tool.sqlfluff.layout.type.comma]
spacing_before = "touch"
line_position = "trailing"

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "upper"
extended_capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.identifiers]
capitalisation_policy = "lower"
extended_capitalisation_policy = "lower"

[tool.sqlfluff.rules.capitalisation.functions]
capitalisation_policy = "upper"
extended_capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.literals]
capitalisation_policy = "upper"
extended_capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.types]
capitalisation_policy = "upper"
extended_capitalisation_policy = "upper"

[tool.sqlfluff.rules.aliasing.table]
aliasing = "explicit"

[tool.sqlfluff.rules.aliasing.column]
aliasing = "implicit"

[tool.sqlfluff.rules.aliasing.expression]
allow_scalar = true

[tool.sqlfluff.rules.ambiguous.column_references]
group_by_and_order_by_style = "consistent"

[tool.sqlfluff.rules.convention.count_rows]
prefer_count_1 = true

[tool.sqlfluff.rules.convention.not_equal]
preferred_not_equal_style = "c_style"

[tool.sqlfluff.rules.convention.select_trailing_comma]
select_clause_trailing_comma = "forbid"

[tool.sqlfluff.rules.layout.select_targets]
wildcard_policy = "single"

[tool.interrogate]
paths = ["./modules/api/src", "./modules/model/src"]
exclude = [
    "./modules/api/tests",
    "./modules/model/alembic",
    "./modules/model/tests",
    "venv",
    ".venv",
    "build",
    "dist",
]
ignore-regex = [
    "^get$",
    "^mock_.*",
    "^test_.*[Base|Invalid|Test|Valid]+Class.*",
]
fail-under = 90
verbose = 3
color = true
ignore-init-method = true
ignore-init-module = true
ignore-module = true
ignore-private = true
ignore-magic = true
ignore-property-decorators = false
ignore-nested-functions = true
generate-badge = "./docs"
badge-format = "svg"
badge-style = "flat"
