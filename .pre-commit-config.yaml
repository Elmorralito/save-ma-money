repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: '(\.svg$|docs/coverage\.xml$)'
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: '^modules/web/tsconfig.*\.json$'
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=4096"]

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.4.0
    hooks:
      - id: sqlfluff-lint
        name: sqlfluff lint
        entry: poetry run sqlfluff lint
        language: system
        files: ^modules/backend/src/papita_txnsmodel/views/.*\.sql$
      - id: sqlfluff-fix
        name: sqlfluff format
        entry: poetry run sqlfluff fix
        language: system
        files: ^modules/backend/src/papita_txnsmodel/views/.*\.sql$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mcp-config-validate
        name: mcp config validate (local only)
        entry: /bin/bash .github/scripts/pre_commit_mcp.sh
        language: system
        pass_filenames: false
        files: ^\.cursor/mcp\.json$
      - id: web-eslint
        name: web eslint (modules/web)
        entry: /bin/bash .github/scripts/pre_commit_web.sh eslint
        language: system
        files: ^modules/web/.*\.(ts|tsx|js|jsx)$
        exclude: ^modules/web/(dist|coverage|node_modules|openapi)/
        require_serial: true
      - id: web-prettier
        name: web prettier (modules/web)
        entry: /bin/bash .github/scripts/pre_commit_web.sh prettier
        language: system
        files: ^modules/web/.*\.(ts|tsx|js|jsx|css|json|md)$
        exclude: (^modules/web/(dist|coverage|node_modules|openapi)/|^modules/web/src/types/api\.d\.ts$|^modules/web/package\.json$)
        require_serial: true
      - id: web-tsc
        name: web tsc (modules/web)
        entry: /bin/bash .github/scripts/pre_commit_web.sh tsc
        language: system
        files: ^modules/web/.*\.(ts|tsx)$
        exclude: ^modules/web/(dist|coverage|node_modules|openapi)/
        pass_filenames: false
        require_serial: true
      - id: web-vitest-related
        name: web vitest related (modules/web)
        entry: /bin/bash .github/scripts/pre_commit_web.sh test
        language: system
        files: ^modules/web/.*\.(ts|tsx)$
        exclude: ^modules/web/(dist|coverage|node_modules|openapi)/
        require_serial: true

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        exclude: "./tests/.*"
        additional_dependencies:
          [
            "mypy==2.4.0",
            "types-pyyaml>=6.0.12.20241230",
            "types-python-dateutil>=2.9.0.20250516",
            "types-tabulate>=0.10.0.20260508",
            "types-toml>=0.10.8.20240310",
            "types-requests>=2.32.4.20250913",
            "types-pytz>=2025.2.0.20250809",
          ]

  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint
        args: ["--config", ".hadolint.yaml"]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        stages: [pre-commit, manual]
        args: ["--fix", "--disable", "MD013,MD033,MD041,MD024,MD025"]
        types_or: [markdown]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        files: "^.*\\.(yaml|yml)$"
        exclude: "^pnpm-lock\\.yaml$"

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: ["-color"]
