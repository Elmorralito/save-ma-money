<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Papita Local CLI Bridge</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        width: 340px;
        margin: 0;
        padding: 14px;
        background: #0b1116;
        color: #e6edf3;
        font-size: 12px;
        line-height: 1.45;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 14px;
      }
      .section {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid #1f2a36;
      }
      .pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
      }
      .ok {
        background: rgba(16, 185, 129, 0.2);
        color: #6ee7b7;
      }
      .err {
        background: rgba(239, 68, 68, 0.2);
        color: #fca5a5;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 5px 0;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
      }
      button {
        border: 1px solid #334155;
        background: #1e293b;
        color: #f8fafc;
        border-radius: 6px;
        padding: 3px 8px;
        font-size: 11px;
        cursor: pointer;
      }
      .muted {
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <h1>Papita Local CLI Bridge</h1>
    <div id="host-status" class="muted">Checking native host…</div>
    <div id="cli-list" class="section"></div>
    <div class="section">
      <strong>Approved origins</strong>
      <div id="origins-list" class="muted" style="margin-top: 6px">Loading…</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
