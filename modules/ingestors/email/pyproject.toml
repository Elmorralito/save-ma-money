[project]
name = "papita-ingestor-email"
version = "0.0.1"
description = "Email / Gmail source plugin for Papita ingestion (papita_ingestor_email)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Elmorralito", email = "drestrepohinc@gmail.com" }]
requires-python = ">=3.10,<3.15"
keywords = ["ingestion", "gmail", "email", "papita"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "google-auth-oauthlib>=1.4.0,<2.0.0",
    "google-auth>=2.56.3,<3.0.0",
    "google-api-python-client>=2.198.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/Elmorralito/save-ma-money/tree/main/modules/ingestors/email"
Repository = "https://github.com/Elmorralito/save-ma-money"
Issues = "https://github.com/Elmorralito/save-ma-money/issues"
Documentation = "https://github.com/Elmorralito/save-ma-money/blob/main/modules/ingestors/email/README.md"

[tool.poetry]
packages = [{ include = "papita_ingestor_email", from = "src/" }]
include = [{ path = "pyproject.toml", format = ["sdist"] }]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
papita-ingestor-core = { path = "../../ingestor-core", develop = true }
google-auth-oauthlib = ">=1.4.0,<2.0.0"
google-auth = ">=2.56.3,<3.0.0"
google-api-python-client = ">=2.198.0,<3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -raq"
testpaths = ["tests"]
