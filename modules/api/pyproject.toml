[project]
name = "papita-transactions-api"
version = "0.0.3a14"
description = "API for this mess"
readme = "README.md"
license = "LICENSE"
requires-python = ">=3.10,<3.15"
authors = [
    { name = "Elmorralito", email = "drestrepohinc@gmail.com" }
]
dependencies = [
    "python-dateutil (>=2.9.0.post0)",
    "papita-transactions-model (>=1.0.0,<2.0)",
    "fastapi (>=0.139.2,<0.140.0)",
    "starlette (>=1.3.1,<2.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "pyjwt[crypto] (>=2.13.0,<3.0.0)",
    "cryptography (>=49.0.0,<50.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "uvicorn[standard] (>=0.51.0,<0.52.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "httpx (>=0.28.1,<0.29.0)",
    "supabase (>=2.31.0,<3.0.0)",
    "redis (>=8.0.1,<9.0.0)",
]

[project.urls]
HomePage = "https://github.com/Elmorralito/save-ma-money"

[tool.poetry]
packages = [
    { include = "papita_txnsapi", from = "src/" },
]

[build-system]
requires = [
    "poetry-core>=2.0.0,<3.0.0",
]
build-backend = "poetry.core.masonry.api"
