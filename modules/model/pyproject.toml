[project]
name = "papita-transactions-model"
version = "0.1.13a28"
description = "SQLModel/PostgreSQL domain layer for Papita financial transactions (papita_txnsmodel)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Elmorralito", email = "drestrepohinc@gmail.com" }]
requires-python = ">=3.10,<3.15"
keywords = ["sqlmodel", "postgresql", "finance", "transactions", "alembic", "papita"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "pydantic(>=2.13.4,<3.0)",
    "pandas(>=2.3.3,<2.4.0)",
    "greenlet (>=3.5.3,<4.0)",
    "mako (>=1.3.12,<2.0)",
    "alembic[tz] (>=1.18.5,<2.0.0)",
    "sqlmodel (>=0.0.39,<1.0)",
    "dotenv (>=0.9.9,<1.0)",
    "psycopg2-binary (>=2.9.12,<3.0)",
    "duckdb-engine (>=0.17.0,<0.18)",
    "sqlalchemy[duckdb-engine] (>=2.0.51,<2.0.52)",
    "toml (>=0.10.2,<0.11.0)",
    "duckdb (>=1.5.4,<2.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "semver (>=3.0.4,<4.0.0)",
    "rapidfuzz (>=3.14.5,<4.0.0)",
    "alembic-utils (>=0.8.8,<0.9.0)",
    "pyyaml (>=6.0.3,<7.0)",
    "tabulate (>=0.10.0,<0.11.0)",
]

[project.urls]
Homepage = "https://github.com/Elmorralito/save-ma-money/tree/main/modules/model"
Repository = "https://github.com/Elmorralito/save-ma-money"
Issues = "https://github.com/Elmorralito/save-ma-money/issues"
Documentation = "https://github.com/Elmorralito/save-ma-money/blob/main/modules/model/README.md"

[tool.poetry]
packages = [{ include = "papita_txnsmodel", from = "src/" }]
# Keep pyproject readable from source checkouts; installed wheels use importlib.metadata.
include = [{ path = "pyproject.toml", format = ["sdist"] }]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
