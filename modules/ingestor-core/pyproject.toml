[project]
name = "papita-ingestor-core"
version = "0.0.1"
description = "Source-agnostic ingestion contracts and pipeline for Papita (papita_ingestor_core)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Elmorralito", email = "drestrepohinc@gmail.com" }]
requires-python = ">=3.10,<3.15"
keywords = ["ingestion", "prefect", "papita", "transactions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "pydantic-settings>=2.15.0,<3.0.0",
]

[project.optional-dependencies]
prefect = ["prefect>=3.0,<4.0"]

[project.urls]
Homepage = "https://github.com/Elmorralito/save-ma-money/tree/main/modules/ingestor-core"
Repository = "https://github.com/Elmorralito/save-ma-money"
Issues = "https://github.com/Elmorralito/save-ma-money/issues"
Documentation = "https://github.com/Elmorralito/save-ma-money/blob/main/modules/ingestor-core/README.md"

[tool.poetry]
packages = [{ include = "papita_ingestor_core", from = "src/" }]
include = [{ path = "pyproject.toml", format = ["sdist"] }]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
papita-transactions-model = { path = "../model", develop = true }
pydantic-settings = ">=2.15.0,<3.0.0"
prefect = { version = ">=3.0,<4.0", optional = true }

[tool.poetry.extras]
prefect = ["prefect"]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -raq"
testpaths = ["tests"]
