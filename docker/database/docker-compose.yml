---
# Database + Redis (B0). Prefer full stack via docker/docker-compose.yml.
#
#   cp environments/local/.env.example environments/local/.env
#   docker compose --env-file environments/local/.env -f docker/database/docker-compose.yml up -d
#
# Host API then uses:
#   REDIS_URL=redis://localhost:6379/0
#   REDIS_ENABLED=true
#
# Env layout: environments/README.md (PAPITA_ENV=local)

name: "${COMPOSE_NAME:-papita-transactions-db}"

networks:
  papita-local-net:
    driver: bridge

volumes:
  papita-local-env:
    driver: local
  papita-redis-data:
    driver: local

services:
  postgres-db:
    container_name: "postgresql-${COMPOSE_NAME:-papita-transactions-db}"
    image: postgres:15-alpine
    restart: unless-stopped
    networks:
      - papita-local-net
    expose:
      - "${POSTGRES_PORT:-${PGPORT:-${DB_PORT}}}"
    ports:
      - "${POSTGRES_PORT:-${PGPORT:-${DB_PORT}}}:${POSTGRES_PORT:-${PGPORT:-${DB_PORT}}}/tcp"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "sh -c 'pg_isready --username=${POSTGRES_USER:-${DB_USER}} --port=${POSTGRES_PORT:-${PGPORT:-${DB_PORT}}} --dbname=${POSTGRES_DB:-${DB_NAME}}'",
        ]
      interval: 15s
      timeout: 10s
      retries: 3
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: "${POSTGRES_USER:-${DB_USER}}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-${DB_PASSWORD}}"
      POSTGRES_DB: "${POSTGRES_DB:-${DB_NAME}}"
      PGPORT: "${POSTGRES_PORT:-${PGPORT:-${DB_PORT}}}"
    volumes:
      - "papita-local-env:/var/lib/postgresql/data:rw"

  redis:
    container_name: "redis-${COMPOSE_NAME:-papita-transactions-db}"
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - papita-local-net
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - papita-redis-data:/data:rw
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
