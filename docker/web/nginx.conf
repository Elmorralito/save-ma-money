# Papita web SPA (PPT-057 / #122)
# Serves Vite build; reverse-proxies /api to the Compose `api` service so BFF
# cookies stay same-origin (papita_sid Path=/api, SameSite=Lax).
#
# CSP / extra security headers: PPT-063 / #128 (not owned here).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Align with API body limits documented in environments/*/ .env.example
    client_max_body_size 1m;

    # SPA fallback — React Router client routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API + BFF cookie path (/api). Do not rewrite Path on Set-Cookie.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;

        # Avoid buffering large JSON list responses unnecessarily
        proxy_buffering on;
        proxy_read_timeout 60s;
    }

    location = /api {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    # Do not cache the SPA shell; hashed assets under /assets/ can be immutable
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
