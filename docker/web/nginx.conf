# Papita web SPA (PPT-057 / #122 + PPT-063 / #128)
# Serves Vite build; reverse-proxies /api to the Compose `api` service so BFF
# cookies stay same-origin (papita_sid Path=/api, SameSite=Lax).
#
# SPA security headers (CSP + baseline) apply to static locations only — not /api.
# API responses keep papita_txnsapi SecurityHeadersMiddleware (no API CSP; Swagger).
# Posture SSOT: modules/web/README.md § nginx Compose packaging / CSP.

# spa-security-headers.inc is included from each static location (nginx does not
# inherit add_header across nested locations). Residual risk: style-src
# 'unsafe-inline' for Radix/shadcn inline positioning styles.

server {
    # Unprivileged image listens on 8080 (Compose maps WEB_PORT:8080)
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Align with API body limits documented in environments/*/ .env.example
    client_max_body_size 1m;

    # Docker embedded DNS: resolve `api` at request time so nginx can start
    # before the upstream is registered (and so standalone image smoke works).
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $api_upstream "api:8000";

    # SPA fallback - React Router client routes
    location / {
        include /etc/nginx/conf.d/spa-security-headers.inc;
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API + BFF cookie path (/api). Do not rewrite Path on Set-Cookie.
    # Do not attach SPA CSP here — leave API middleware as SSOT for /api responses.
    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;

        proxy_buffering on;
        proxy_read_timeout 60s;
    }

    location = /api {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    # Do not cache the SPA shell; hashed assets under /assets/ can be immutable
    location = /index.html {
        include /etc/nginx/conf.d/spa-security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        include /etc/nginx/conf.d/spa-security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
}
