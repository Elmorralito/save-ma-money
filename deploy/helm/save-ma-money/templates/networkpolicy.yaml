{{- if .Values.networkPolicy.enabled }}
# VPN / private-lab-only isolation: no public cloud ingress or unrestricted internet egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "papita.fullname" . }}-vpn-only
  labels:
    {{- include "papita.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
        {{- with .Values.networkPolicy.vpnCidrs }}
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
        {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- with .Values.networkPolicy.vpnCidrs }}
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
    {{- end }}
{{- if .Values.orchestrator.ingestor.enabled }}
---
# Hatchet gRPC egress to the shared in-cluster orchestrator control plane only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "papita.fullname" . }}-orchestrator-egress
  labels:
    {{- include "papita.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["backend", "worker-ingestor"]
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.orchestratorNamespace }}
      ports:
        - protocol: TCP
          port: 7070
{{- end }}
{{- end }}
